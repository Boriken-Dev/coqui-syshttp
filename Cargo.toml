[package]
name = "coqui-syshttp"
version = "0.1.0"
description = "HTTP plumbing that follows the system: the system proxy (PAC, WPAD), proxy login, the OS certificate verifier and client certificates from OS keystores"
readme = "README.md"
edition = "2024"
# edition 2024 needs 1.85; boa_engine 0.21 (feature `pac`) needs 1.88; rcgen (tests) needs 1.88.
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Boriken-Dev/coqui-syshttp"
keywords = ["proxy", "pac", "tls", "client-certificate", "system"]
categories = ["network-programming", "web-programming::http-client"]
exclude = [".*", "*.local.*"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
# PAC scripts and WPAD discovery evaluated in-process by the Boa JavaScript engine. Windows asks WinHTTP, which
# needs no engine; elsewhere a PAC location without this feature is an error (or DIRECT, by setting).
pac = ["dep:boa_engine", "dep:gethostname"]
# A rustls client configuration verified by the operating system, and client certificates chosen by the
# server's acceptable CAs.
tls = [
    "dep:rustls",
    "dep:rustls-platform-verifier",
    "dep:x509-cert",
    "dep:sha2",
    "dep:serde_json",
    "dep:windows-registry",
    "dep:rustls-cng",
    "dep:security-framework",
]
# Client certificates held by a PKCS#11 module (smart cards, tokens, SoftHSM).
pkcs11 = ["tls", "dep:cryptoki"]
# Negotiate and NTLM proxy and server login: SSPI on Windows, GSSAPI elsewhere (needs the system's GSSAPI library
# and, to build, libclang).
negotiate = ["dep:libgssapi"]
# `ureq` 3 sending through the system's proxy, proxy login and TLS.
ureq = ["tls", "dep:ureq"]

[dependencies]
# URLs and proxy URLs.
http = "1"
# Credentials in a proxy URL.
percent-encoding = "2"
# Basic and Negotiate tokens.
base64 = "0.22"
# Error boilerplate.
thiserror = "2"
# Diagnostics; the binary installs the subscriber.
tracing = { version = "0.1", default-features = false, features = ["std"] }
# The addresses of this machine's interfaces, for the `<subnet>` bypass entry.
if-addrs = "0.15"
# CIDR bypass rules.
coqui-net-acl = { git = "https://github.com/Boriken-Dev/coqui-net-acl", rev = "839435acc29b76ec0190b7099f870863313d3fcd" }

# PAC evaluation (feature `pac`); pre-1.0, the only maintained pure-Rust JavaScript engine, no C toolchain needed.
boa_engine = { version = "0.21", optional = true }
# This host's name for `myIpAddress` and WPAD (feature `pac`).
gethostname = { version = "1", optional = true }

# TLS (feature `tls`).
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-platform-verifier = { version = "0.7", optional = true }
# Subject, issuer, validity and key usage of a candidate client certificate.
x509-cert = { version = "0.3", default-features = false, features = ["std"], optional = true }
# The identity of a certificate, for a remembered choice.
sha2 = { version = "0.10", default-features = false, optional = true }
cryptoki = { version = "0.12", optional = true }
# Browser auto-select policy entries.
serde_json = { version = "1", optional = true }
# The blocking client of the family; TLS is this crate's own, so no TLS feature of ureq is needed.
ureq = { version = "3.5", default-features = false, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Credentials",
    "Win32_System_Rpc",
    "Win32_System_SystemInformation",
] }
# Windows certificate stores and CNG keys as rustls signing keys (feature `tls`).
rustls-cng = { version = "0.7", default-features = false, features = ["ring", "tls12"], optional = true }
# Browser auto-select policy in the registry (feature `tls`).
windows-registry = { version = "0.6", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# The Keychain's identities as rustls signing keys (feature `tls`).
security-framework = { version = "3", optional = true }

[target.'cfg(unix)'.dependencies]
libgssapi = { version = "0.11", optional = true }

[dev-dependencies]
# Test CA, server and client certificates, generated by each test.
rcgen = "0.14"
p12-keystore = "0.4"
tempfile = "3"
