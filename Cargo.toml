[package]
name = "coqui-syshttp"
version = "0.1.0"
description = "HTTP that follows the system: the system proxy, proxy login, the OS certificate verifier and keystore client certificates, one call for a ureq agent"
readme = "README.md"
edition = "2024"
# edition 2024 needs 1.85; boa_engine 0.21 (feature `pac`) needs 1.88; rcgen (tests) needs 1.88.
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Boriken-Dev/coqui-syshttp"
keywords = ["proxy", "pac", "tls", "client-certificate", "system"]
categories = ["network-programming", "web-programming::http-client"]
exclude = [".*", "*.local.*", "/tools/", "/packaging/"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
# PAC scripts and WPAD discovery evaluated in-process by the Boa JavaScript engine (coqui-proxy).
pac = ["coqui-proxy/pac"]
# Negotiate and NTLM proxy and server login: SSPI on Windows, GSSAPI elsewhere.
negotiate = ["coqui-proxy/negotiate"]
# A rustls client configuration verified by the operating system, and client certificates chosen by the
# server's acceptable CAs (coqui-sslcontext, re-exported as `tls`).
tls = ["dep:coqui-sslcontext", "coqui-sslcontext/system", "coqui-proxy/tls"]
# Client certificates held by a PKCS#11 module (smart cards, tokens, SoftHSM).
pkcs11 = ["tls", "coqui-sslcontext/pkcs11"]
# `ureq` 3 sending through the system's proxy, proxy login and TLS.
ureq = ["tls", "dep:ureq", "dep:rustls"]
# A hyper-util client sending through the system's proxy, proxy login and TLS (`hyper::client`).
hyper = [
    "tls",
    "coqui-proxy/hyper",
    "dep:hyper",
    "dep:hyper-util",
    "dep:tokio",
    "dep:tokio-rustls",
    "dep:tower-service",
]
# `reqwest` sending through the system's proxy and TLS (`reqwest::client`).
reqwest = ["tls", "coqui-proxy/relay", "dep:reqwest", "dep:rustls", "dep:tracing", "dep:tokio"]
# `reqwest::blocking` sending through the system's proxy and TLS (`reqwest::blocking`), failover through a relay
# on threads of its own (coqui-proxy's `relay-blocking`).
reqwest-blocking = ["reqwest", "reqwest/blocking", "coqui-proxy/relay-blocking"]
# The session layer: a client above `ureq` that owns redirects, cookies, tokens, hooks, retries and a deadline,
# with its settings read through prefixed environment variables.
session = ["ureq", "dep:url", "dep:regex", "dep:flate2", "dep:percent-encoding", "dep:encoding_rs"]
# JSON bodies and replies of the session layer.
json = ["session", "dep:serde", "dep:serde_json"]
# The session layer cookie jars as `reqwest` cookie stores.
session-reqwest = ["session", "reqwest", "reqwest/cookies"]

[dependencies]
coqui-proxy = { git = "https://github.com/Boriken-Dev/coqui-proxy", rev = "e66b9ce26b9f0d2dc18f2262ec015742b2fe4829" }
coqui-sslcontext = { git = "https://github.com/Boriken-Dev/coqui-sslcontext", rev = "955cd9a455a288a523418daad7e846008c2bf291", optional = true }
# Error boilerplate.
thiserror = "2"
# Why a request cannot be routed as asked (feature `reqwest`).
tracing = { version = "0.1", default-features = false, features = ["std"], optional = true }
# The blocking client of the family; TLS is the family's own, so no TLS feature of ureq is needed.
ureq = { version = "3.5", default-features = false, optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"], optional = true }

# hyper's client (feature `hyper`): the body trait, `Uri`, and the legacy client with its connector traits.
hyper = { version = "1", default-features = false, optional = true }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "http2", "tokio"], optional = true }
# TLS to the origin over the tunnel; `spawn_blocking` for the keystore (feature `hyper`); the runtime handle the
# `reqwest` relay runs on (feature `reqwest`).
tokio = { version = "1", default-features = false, features = ["rt"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
tower-service = { version = "0.3", optional = true }
# The async client of the ecosystem; TLS is the family's own (`use_preconfigured_tls`), so no TLS backend of its own is wanted.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "socks"], optional = true }

# The session layer (feature `session`).
url = { version = "2", optional = true }
regex = { version = "1", optional = true }
flate2 = { version = "1", optional = true }
percent-encoding = { version = "2", optional = true }
encoding_rs = { version = "0.8", optional = true }
serde = { version = "1", optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
# Test CA, server and client certificates, generated by each test.
rcgen = "0.14"
tempfile = "3"
http = "1"
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
http-body-util = "0.1"
bytes = "1"
proptest = "1"
