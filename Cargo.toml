[package]
name = "coqui-syshttp"
version = "0.1.0"
description = "HTTP that follows the system: the system proxy, proxy login, the OS certificate verifier and keystore client certificates, one call for a ureq agent"
readme = "README.md"
edition = "2024"
# edition 2024 needs 1.85; boa_engine 0.21 (feature `pac`) needs 1.88; rcgen (tests) needs 1.88.
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Boriken-Dev/coqui-syshttp"
keywords = ["proxy", "pac", "tls", "client-certificate", "system"]
categories = ["network-programming", "web-programming::http-client"]
exclude = [".*", "*.local.*", "/tools/"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
# PAC scripts and WPAD discovery evaluated in-process by the Boa JavaScript engine (coqui-proxy).
pac = ["coqui-proxy/pac"]
# Negotiate and NTLM proxy and server login: SSPI on Windows, GSSAPI elsewhere.
negotiate = ["coqui-proxy/negotiate"]
# A rustls client configuration verified by the operating system, and client certificates chosen by the
# server's acceptable CAs (coqui-sslcontext, re-exported as `tls`).
tls = ["dep:coqui-sslcontext", "coqui-sslcontext/system", "coqui-proxy/tls"]
# Client certificates held by a PKCS#11 module (smart cards, tokens, SoftHSM).
pkcs11 = ["tls", "coqui-sslcontext/pkcs11"]
# `ureq` 3 sending through the system's proxy, proxy login and TLS.
ureq = ["tls", "dep:ureq", "dep:rustls"]

[dependencies]
coqui-proxy = { git = "https://github.com/Boriken-Dev/coqui-proxy", rev = "ff844043be1f895022aef5ac24e97512cf723346" }
coqui-sslcontext = { git = "https://github.com/Boriken-Dev/coqui-sslcontext", rev = "955cd9a455a288a523418daad7e846008c2bf291", optional = true }
# Error boilerplate.
thiserror = "2"
# The blocking client of the family; TLS is the family's own, so no TLS feature of ureq is needed.
ureq = { version = "3.5", default-features = false, optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"], optional = true }

[dev-dependencies]
# Test CA, server and client certificates, generated by each test.
rcgen = "0.14"
tempfile = "3"
http = "1"
base64 = "0.22"
